<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>分享</title>

<link rel="stylesheet" href="share.css">

</head>

<body>

<div class="container">

   <div class="editor">

    <div class="editor-title">
        背景
    </div>

    <div class="background-list">

       <button class="bg-item active">
羊皮纸
</button>


<button class="bg-item upload-btn">

上传图片

</button>

<input 
type="file"
id="bg-upload"
accept="image/*"
hidden>

    </div>


    <div class="editor-title">
        语言
    </div>


    <div class="language-list">

        <button class="lang-item active">
            中文
        </button>

        <button class="lang-item">
            English
        </button>

        <button class="lang-item">
            日本語
        </button>

        <button class="lang-item">
            한국어
        </button>

    </div>

</div><div class="editor-title">

文字颜色

</div>


<div class="color-list">


<button 
class="color-item active"
data-color="gold">

金色

</button>


<button 
class="color-item"
data-color="moon">

月光

</button>


<button 
class="color-item"
data-color="sky">

星蓝

</button>


<button 
class="color-item"
data-color="forest">

森林

</button>


<button 
class="color-item"
data-color="sakura">

樱花

</button>


<button 
class="color-item"
data-color="violet">

紫夜

</button>


<button 
class="color-item"
data-color="ocean">

海洋

</button>


<button 
class="color-item"
data-color="obsidian">

黑曜

</button>


</div>

<div class="preview" id="poster">


    <div class="share-date">

        2026 年 7 月 27 日

    </div>


    <div class="share-answer">

        每一朵花，<br>
        都有属于自己的季节。

    </div>


    <div class="share-meaning">

        等待，<br>
        也是成长的一部分。

    </div>


    <div class="share-logo">

        JOYVERSE

    </div>


</div>
    
    <button class="save-btn">

        保存图片

    </button>

    <button class="back-btn">

        返回答案

    </button>

</div>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script src="translations.js"></script>
<script src="share.js"></script>

</body>

</html>
